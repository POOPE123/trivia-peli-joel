<html>
    <head>
        <title>Trivial pursuit peli</title>
        <link rel="stylesheet" href="styles.css">
        <script src="game.js" defer></script>
    </head>
    <body>
        <header class="game-header">
            <h1>Trivia peli</h1>
            <p>Kerää kaikki kategoriat, ennen robottia!</p>
        </header>
        <section class="status-panel">
            <article class="player-card">
                <h2>Pelaaja</h2>
                <img src="Profiili.png" class="player-image">
                <p>Kerätyt kategoriat: 0/6</p>
            </article>

            <article class="dice-panel">
                <p>Vuorossa:</p>
                <h2>Pelaaja</h2>
                <button>Heitä noppaa</button>
                <div id="board" class="board"></div>
            </article>
            
            <article class="player-card">
                <h2>Robotti</h2>
                <img src="robotti.png" class="player-image">
                <p>Kerätyt kategoriat: 0/6</p>
            </article>
        </section>
    </body>
</html>
